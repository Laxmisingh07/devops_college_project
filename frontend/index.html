<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>E-Commerce Microservices</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>E-Commerce Application</h1>
        <p>Microservices Demo</p>
    </header>

    <main>

        <!-- Add Product Form -->
        <section class="form-section">

            <h2>Add Product / Customer</h2>

            <form id="productForm">

                <label for="productName">Product Name</label>
                <input
                    type="text"
                    id="productName"
                    placeholder="Enter product name"
                    required
                >

                <label for="price">Price</label>
                <input
                    type="number"
                    id="price"
                    placeholder="Enter price"
                    required
                >

                <label for="customerNumber">Customer Number</label>
                <input
                    type="text"
                    id="customerNumber"
                    placeholder="Example: C001"
                    required
                >

                <label for="quantity">Quantity</label>
                <input
                    type="number"
                    id="quantity"
                    value="1"
                    min="1"
                    required
                >

                <button type="submit">
                    Add Product
                </button>

            </form>

            <p id="message"></p>

        </section>


        <!-- Products -->
        <section>

            <h2>Products</h2>

            <div id="products" class="container">
            </div>

        </section>


        <!-- Orders -->
        <section>

            <h2>Orders</h2>

            <div id="orders" class="container">
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
